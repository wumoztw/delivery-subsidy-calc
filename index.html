<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>外送專法與疊單收益精算系統 | Uber Eats 實質時薪與差額補貼精算</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="外送專法精算">
  <meta name="theme-color" content="#4f7646">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <!-- ═══ Google Fonts 最佳化載入 (Stitch FinTech 配套) ═══ -->
  <!-- 1. DNS 預連線 (Preconnect)：消除 DNS/TLS 延遲 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 2. 精簡字重載入：Noto Sans 與 Noto Sans TC (400, 500, 600) + JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- 3. 非同步載入 JetBrains Mono 降低阻塞 -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" onload="this.rel='stylesheet'">
  <!-- 樣式：Tailwind CLI 建置後的精簡 CSS（npm run build:css） -->
  <link rel="stylesheet" href="css/app.css?v=20261013a">
  <!-- 執行期函式庫改為本地 vendor，離線（PWA）也能開 -->
  <script src="vendor/vue.global.prod.js?v=20261013a"></script>
  <script src="vendor/papaparse.min.js?v=20261013a"></script>
  <!-- 核心模組（順序有依賴：config → calc → cycle/parser/report → app） -->
  <script src="js/config.js?v=20261013a"></script>
  <script src="js/calc.js?v=20261013a"></script>
  <script src="js/cycle.js?v=20261013a"></script>
  <script src="js/parser.js?v=20261013a"></script>
  <script src="js/report.js?v=20261013a"></script>
  <script src="js/tone.js?v=20261013a"></script>
  <script src="js/statement.js?v=20261013a"></script>
  <!-- 畫面元件（在 app.js 之前載入，由 app.js 統一註冊） -->
  <script src="js/components/AppHeader.js?v=20261013a"></script>
  <script src="js/components/RateReminder.js?v=20261013a"></script>
  <script src="js/components/TabDashboard.js?v=20261013a"></script>
  <script src="js/components/TabTrips.js?v=20261013a"></script>
  <script src="js/components/SimPanel.js?v=20261013a"></script>
  <script src="js/components/VehicleMatrix.js?v=20261013a"></script>
  <script src="js/components/SingleOrderPlan.js?v=20261013a"></script>
  <script src="js/components/VehicleHandbook.js?v=20261013a"></script>
  <script src="js/components/WatchVsBill.js?v=20261013a"></script>
  <script src="js/components/TabTactics.js?v=20261013a"></script>
  <script src="js/components/TabAnalysis.js?v=20261013a"></script>
  <script src="js/components/TabRules.js?v=20261013a"></script>
  <script src="js/components/MobileStatusBar.js?v=20261013a"></script>

</head>
<body class="bg-ink-50 text-ink-950 min-h-screen font-sans antialiased selection:bg-jade-500 selection:text-white pb-24 sm:pb-8">
  <div id="app" v-cloak class="max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-8 space-y-4 sm:space-y-6">
    <app-header></app-header>
    <!-- 跨年度費率提醒 -->
    <rate-reminder></rate-reminder>
    <tab-dashboard></tab-dashboard>
    <tab-trips></tab-trips>
    <tab-tactics></tab-tactics>
    <tab-analysis></tab-analysis>
    <tab-rules></tab-rules>
    <mobile-status-bar></mobile-status-bar>
    <paste-modal></paste-modal>
    <manual-modal></manual-modal>
    <statement-modal></statement-modal>

    <!-- 底部版權宣告 -->
    <footer class="text-center text-[10px] sm:text-xs text-ink-500 py-3 border-t border-ink-200/60 flex flex-col sm:flex-row items-center justify-between gap-1">
      <div>外送專法與疊單收益精算系統 · 開源離線版（純本機運算）</div>
      <div>Powered by Vue 3.5</div>
    </footer>

  </div>

  <script>
    // 腳本載入或啟動失敗時，不要整頁空白：顯示提示並給重新整理按鈕
    // 清掉離線快取與 Service Worker（版本錯配時的自我修復）
    window.__dscResetCache = function () {
      var jobs = [];
      try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
      try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
      return Promise.all(jobs).catch(function () {});
    };
    window.__dscShowFatal = function (msg) {
      // 第一次失敗：多半是快取到舊檔，自動清快取並重新載入一次（同一分頁只做一次，避免無限重整）
      var healed = false;
      try { healed = sessionStorage.getItem('dsc_healed') === '1'; } catch (e) { healed = true; }
      if (!healed) {
        try { sessionStorage.setItem('dsc_healed', '1'); } catch (e) {}
        window.__dscResetCache().then(function () { location.reload(); });
        return;
      }
      var el = document.getElementById('app');
      if (el) el.removeAttribute('v-cloak');
      document.body.innerHTML = '<div style="max-width:32rem;margin:15vh auto;padding:1.5rem;font-family:sans-serif;line-height:1.6;border:1px solid #e2e8f0;border-radius:12px;background:#fff;color:#111c2d">'
        + '<h2 style="margin:0 0 .5rem;font-size:1.1rem">頁面載入失敗</h2>'
        + '<p style="margin:0 0 1rem;font-size:.9rem">通常是瀏覽器還留著舊版檔案。請按下方按鈕重新整理；仍失敗請把下面的錯誤訊息截圖。</p>'
        + '<button onclick="window.__dscResetCache().then(function(){location.reload()})" style="background:#06c167;color:#fff;border:0;border-radius:8px;padding:.5rem 1rem;font-size:.9rem;cursor:pointer">重新整理</button>'
        + '<pre style="white-space:pre-wrap;font-size:.75rem;color:#be123c;margin-top:1rem">' + String(msg).replace(/</g, '&lt;') + '</pre></div>';
    };
  </script>
  <script src="js/app.js?v=20261013a"></script>
</body>
</html>
