name: Test & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 單元測試
        run: npm test
      - name: 檢查 css/app.css 與原始碼同步
        run: |
          npm run build
          git diff --exit-code -- css/app.css vendor/ || (echo "::error::css/app.css 或 vendor/ 未更新，請在本機執行 npm run build 後提交" && exit 1)

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 只打包網站需要的檔案
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js vendor icons data _site/
          rm -f _site/css/src.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
