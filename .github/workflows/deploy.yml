name: Deploy to GitHub Pages with AI Key Injection

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject NVIDIA AI API Key
        env:
          NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$NVIDIA_KEY" ]; then
            echo "Successfully found NVIDIA_API_KEY! Injecting into index.html..."
            sed -i "s|__NVIDIA_API_KEY__|$NVIDIA_KEY|g" index.html
            sed -i "s|__OPENROUTER_API_KEY__|$NVIDIA_KEY|g" index.html
          else
            echo "::warning::NVIDIA_API_KEY secret is not set in GitHub Secrets."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
